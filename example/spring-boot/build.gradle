// Shared build for every Spring Boot example in this folder. Examples only contain src/ (and README.md).
// Run one example's tests: ./gradlew :<example>:test    All: ./gradlew test
plugins {
    id 'org.springframework.boot' version '3.5.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    repositories { mavenCentral() }

    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly 'com.h2database:h2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // @extra-deps (the routine adds dependencies an example needs above this line)
    }

    tasks.named('test') { useJUnitPlatform() }
}
